---
# - name: Prevent grub from being upgraded
#   ansible.builtin.dpkg_selections:
#     name: grub2-common
#     selection: hold

- name: Upgrade
  become: true
  block:
    - name: Create Node Exporter textfile collector directory
      ansible.builtin.file:
        path: /var/lib/prometheus/node-exporter
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install APT upgrade metrics collector
      ansible.builtin.copy:
        src: apt-upgrade-metrics.py
        dest: /usr/local/sbin/apt-upgrade-metrics
        owner: root
        group: root
        mode: "0755"

    - name: Install APT upgrade metrics systemd service and timer
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - apt-upgrade-metrics.service
        - apt-upgrade-metrics.timer

    - name: Refresh APT upgrade metric now and enable its timer
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: "{{ item == 'apt-upgrade-metrics.timer' }}"
        state: started
        daemon_reload: true
      loop:
        - apt-upgrade-metrics.service
        - apt-upgrade-metrics.timer

    - name: Upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Refresh the last actual package-upgrade metric
      ansible.builtin.command:
        cmd: /usr/local/sbin/apt-upgrade-metrics
      changed_when: false

    - name: Check if a reboot is required
      register: upgrade_rebootrequired
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: false

    - name: Reboot if /var/run/reboot-required exists
      ansible.builtin.reboot:
      when: upgrade_rebootrequired.stat.exists

    - name: Install unattended-upgrades
      ansible.builtin.apt:
        pkg:
          - unattended-upgrades

    - name: Update debconf parameters
      ansible.builtin.debconf:
        name: "unattended-upgrades"
        question: "unattended-upgrades/enable_auto_updates"
        value: "true"
        vtype: "boolean"

    - name: Reconfigure dpkg
      ansible.builtin.command:
        creates: /etc/apt/apt.conf.d/20auto-upgrades
        cmd: dpkg-reconfigure -f noninteractive unattended-upgrades

