---
- name: Hostname
  become: true
  block:
    - name: Ensure hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure hostname points to 127.0.0.1 in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1\t{{ inventory_hostname }}"

