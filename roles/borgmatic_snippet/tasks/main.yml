---

- name: Set configuration paths
  ansible.builtin.set_fact:
    borgmatic_snippet_snippet: "/etc/borgmatic.d/snippets/{{ borgmatic_snippet_name }}.yaml"
    borgmatic_snippet_config: "/etc/borgmatic.d/{{ borgmatic_snippet_name }}.yaml"

- name: Bormatic snippet
  become: true
  block:
    - name: Copy borgmatic snippet
      ansible.builtin.copy:
        src: "{{ borgmatic_snippet_file }}"
        dest: "{{ borgmatic_snippet_snippet }}"
        mode: "0644"

    - name: Instanciate borgmatic configuration
      ansible.builtin.template:
        src: borgmatic_config.yaml.j2
        dest: "{{ borgmatic_snippet_config }}"
        mode: "0644"

    - name: Create Borg repository monitor configuration directory
      ansible.builtin.file:
        path: /etc/borg-backup-monitor/repositories.d
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Configure Borg repository monitor targets
      ansible.builtin.template:
        src: repository.json.j2
        dest: "/etc/borg-backup-monitor/repositories.d/{{ item }}-{{ borgmatic_snippet_name }}.json"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ groups['backup_destinations'] }}"
      vars:
        borg_backup_monitor_store: "{{ item }}"

    - name: Initialize repositories
      ansible.builtin.command:
        cmd: "borgmatic --config {{ borgmatic_snippet_config }} repo-create --encryption repokey"
      register: borgmatic_snippet_repo_create
      # borg reports a missing repository before creating it, and stays silent
      # otherwise. Don't test for any stderr: ssh warnings land there too.
      changed_when: "'does not exist' in borgmatic_snippet_repo_create.stderr"

    - name: "Create new backup {{ borgmatic_snippet_name }}"
      ansible.builtin.command:
        cmd: "borgmatic --config {{ borgmatic_snippet_config }} create"
      changed_when: true
      when: "'borgmatic_create' in ansible_run_tags"
      tags:
        - never
        - borgmatic_create

    # restore only brings the databases back: snippets list the folders to
    # extract in borgmatic_snippet_extract_paths
    - name: "Extract last backup files {{ borgmatic_snippet_name }}"
      ansible.builtin.command:
        cmd: >-
          borgmatic --config {{ borgmatic_snippet_config }} extract --archive latest --destination /
          {% for path in borgmatic_snippet_extract_paths %} --path {{ path | regex_replace('^/', '') }}{% endfor %}
      changed_when: true
      when:
        - "'borgmatic_restore' in ansible_run_tags"
        - borgmatic_snippet_extract_paths | default([]) | length > 0
      tags:
        - never
        - borgmatic_restore

    - name: "Restore last backup {{ borgmatic_snippet_name }}"
      ansible.builtin.command:
        cmd: "borgmatic --config {{ borgmatic_snippet_config }} restore --archive latest"
      changed_when: true
      when: "'borgmatic_restore' in ansible_run_tags"
      tags:
        - never
        - borgmatic_restore
