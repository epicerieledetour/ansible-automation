---
- name: Caddy
  become: true
  block:
    - name: Enable Caddy repo via extrepo
      ansible.builtin.command:
        cmd: extrepo enable caddyserver
        creates: /etc/apt/sources.list.d/extrepo_caddyserver.sources

    - name: Update apt cache after enabling new repo
      ansible.builtin.apt:
        update_cache: true

    - name: Install caddy
      ansible.builtin.apt:
        name: caddy
        state: present

    - name: Make caddy directories
      ansible.builtin.file:
        path: "/etc/caddy/{{ item }}"
        state: directory
        mode: "u=rwx,g=rx,o=rx"
      loop:
        - sites.d
        - global.d

    - name: Copy main caddy configuration
      ansible.builtin.copy:
        src: Caddyfile
        dest: /etc/caddy/Caddyfile
      notify:
        - caddy changed

    - name: Use Caddy internal CA Root in devevlopment mode
      ansible.builtin.copy:
        src: global.d/00-local_certs.caddy
        dest: /etc/caddy/global.d/00-local_certs.caddy
      when: deployment_is_dev
      notify:
        - caddy changed

    - name: Open http port 80 for caddy
      community.general.ufw:
        rule: allow
        port: http

    - name: Open https port 443 for caddy
      community.general.ufw:
        rule: allow
        port: https

