---
- name: Caddy
  become: true
  block:
    - name: Enable Caddy repo via extrepo
      ansible.builtin.command:
        cmd: extrepo enable caddyserver
        creates: /etc/apt/sources.list.d/extrepo_caddyserver.sources

    - name: Update apt cache after enabling new repo
      ansible.builtin.apt:
        update_cache: true

    - name: Install caddy
      ansible.builtin.apt:
        name: caddy
        state: present

    - name: Make /srv/www directory
      ansible.builtin.file:
        path: /srv/www
        state: directory
        mode: "u=rwx,g=rx,o=rx"
        owner: www-data
        group: www-data

    - name: Make /etc/caddy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "u=rwx,g=rx,o=rx"
        owner: caddy
        group: caddy
      loop:
        - /etc/caddy
        - /etc/caddy/sites.d
        - /etc/caddy/global.d

    - name: Open http port 80 for caddy
      community.general.ufw:
        rule: allow
        port: http

    - name: Open https port 443 for caddy
      community.general.ufw:
        rule: allow
        port: https

- name: Caddy as user caddy
  become: true
  become_user: caddy
  block:

    - name: Copy main caddy configuration
      ansible.builtin.copy:
        src: Caddyfile
        dest: /etc/caddy/Caddyfile
      notify:
        - caddy changed

    - name: Use Caddy internal CA Root in development mode
      ansible.builtin.copy:
        src: global.d/00-local_certs.caddy
        dest: /etc/caddy/global.d/00-local_certs.caddy
      when: deployment_is_dev
      notify:
        - caddy changed
