---
# Resolved here: in the include's vars, role_path would be borgmatic_snippet's
- name: "Setting the borgmatic snippet path"
  ansible.builtin.set_fact:
    borgmatic_system_borgmatic_snippet_file: "{{ role_path }}/files/system.yaml"

- name: Setup borgmatic system backup
  ansible.builtin.include_role:
    name: borgmatic_snippet
  vars:
    borgmatic_snippet_file: "{{ borgmatic_system_borgmatic_snippet_file }}"
    borgmatic_snippet_name: system
