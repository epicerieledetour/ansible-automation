---
- name: Mattermost
  become: true
  block:

    - name: Install PostgreSQL
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - curl  # For mattermost-import
          - postgresql
          - python3-psycopg2  # For the community.postgresql.* modules
          - rsync  # To copy a mattermost-import bundle in

    - name: Create user mattermost
      ansible.builtin.user:
        name: mattermost
        system: true
        home: "{{ mattermost_root_dir }}"
        create_home: false
        shell: /usr/sbin/nologin

    - name: Make the mattermost folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: mattermost
        group: mattermost
        mode: "u=rwx,g=rx,o="
      loop:
        - "{{ mattermost_root_dir }}"
        - "{{ mattermost_root_dir }}/config"
        - "{{ mattermost_root_dir }}/data"
        - "{{ mattermost_install_dir }}"

- name: Mattermost as postgres
  become: true
  become_user: postgres
  block:

    - name: Create PostgreSQL user mattermost
      community.postgresql.postgresql_user:
        name: mattermost

    - name: Create PostgreSQL database mattermost
      community.postgresql.postgresql_db:
        name: mattermost
        owner: mattermost
        encoding: UTF8
        template: template0

    # borgmatic.service can't change user, so its pg_dump connects as root
    - name: Create PostgreSQL user root
      community.postgresql.postgresql_user:
        name: root

    - name: Let PostgreSQL user root read the database
      community.postgresql.postgresql_membership:
        groups: pg_read_all_data
        target_roles: root

    # mattermost creates its tables on first start, mattermost-import restores
    # them from the other server
    - name: Check whether the database holds a mattermost server
      community.postgresql.postgresql_query:
        db: mattermost
        query: "select to_regclass('public.users') is not null as initialized"
      register: _mattermost_db
      changed_when: false
      check_mode: false

    - name: Keep an empty mattermost stopped until mattermost-import
      ansible.builtin.set_fact:
        mattermost_awaits_import: "{{ not _mattermost_db.query_result[0].initialized and not mattermost_start_empty | bool }}"

- name: Mattermost as mattermost
  become: true
  become_user: mattermost
  block:

    - name: "Download mattermost {{ mattermost_version }}"
      ansible.builtin.get_url:
        url: "https://releases.mattermost.com/{{ mattermost_version }}/mattermost-team-{{ mattermost_version }}-linux-amd64.tar.gz"
        dest: "{{ mattermost_install_dir }}/mattermost-team-{{ mattermost_version }}-linux-amd64.tar.gz"
        checksum: "sha256:{{ mattermost_sha256 }}"
        mode: "u=rw,g=r,o="

    - name: "Make the installation folder of mattermost {{ mattermost_version }}"
      ansible.builtin.file:
        path: "{{ mattermost_install_dir }}/{{ mattermost_version }}"
        state: directory
        mode: "u=rwx,g=rx,o="

    # Each version gets its own folder, next to the previous ones. There is
    # no going back by pointing current at an older one: mattermost migrates
    # the database on start, restore a backup instead
    - name: "Extract mattermost {{ mattermost_version }}"
      ansible.builtin.unarchive:
        src: "{{ mattermost_install_dir }}/mattermost-team-{{ mattermost_version }}-linux-amd64.tar.gz"
        dest: "{{ mattermost_install_dir }}/{{ mattermost_version }}"
        remote_src: true
        creates: "{{ mattermost_install_dir }}/{{ mattermost_version }}/mattermost/bin/mattermost"

    - name: "Use mattermost {{ mattermost_version }}"
      ansible.builtin.file:
        src: "{{ mattermost_install_dir }}/{{ mattermost_version }}/mattermost"
        dest: "{{ mattermost_install_dir }}/current"
        state: link
      notify:
        - mattermost changed

- name: Mattermost service
  become: true
  block:

    - name: Instanciate mattermost environment file
      ansible.builtin.template:
        src: mattermost.env.j2
        dest: "{{ mattermost_env_file }}"
        mode: "u=rw,g=r,o=r"
      notify:
        - mattermost changed

    - name: Instanciate mattermost systemd service file
      ansible.builtin.template:
        src: mattermost.service.j2
        dest: /etc/systemd/system/mattermost.service
        mode: "u=rw,g=r,o=r"
      notify:
        - mattermost changed

    - name: Instanciate mattermost-import
      ansible.builtin.template:
        src: mattermost-import.j2
        dest: /usr/local/sbin/mattermost-import
        mode: "u=rwx,g=,o="

    # Disabled too, so a reboot doesn't start it: mattermost-import enables it
    - name: Enable mattermost systemd service
      ansible.builtin.systemd:
        name: mattermost
        enabled: "{{ not mattermost_awaits_import }}"
        state: "{{ mattermost_awaits_import | ternary('stopped', 'started') }}"
        daemon_reload: true

    - name: Say mattermost waits for its data
      ansible.builtin.debug:
        msg: >-
          mattermost stays stopped while its database is empty: load the old
          server with mattermost-import, or set mattermost_start_empty to start
          from scratch
      when: mattermost_awaits_import

- name: Instanciate caddy file
  become: true
  become_user: caddy
  ansible.builtin.template:
    src: mattermost.caddy.j2
    dest: /etc/caddy/sites.d/mattermost.caddy
    owner: caddy
    group: caddy
    mode: "u=rw,g=r,o=r"
  notify:
    - caddy changed

- name: Setup backup
  ansible.builtin.include_tasks:
    file: backup.yml
