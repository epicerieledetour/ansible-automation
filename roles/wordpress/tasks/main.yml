---
# MariaDB

- name: Wordpress as root
  become: true
  block:

    - name: Enable PHP repo via extrepo
      ansible.builtin.command:
        cmd: extrepo enable sury
        creates: /etc/apt/sources.list.d/extrepo_sury.sources

    - name: Install MariaDB and PHP
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - mariadb-server
          - "php{{ wordpress_php_version }}-cli"
          - "php{{ wordpress_php_version }}-curl"
          - "php{{ wordpress_php_version }}-fpm"
          - "php{{ wordpress_php_version }}-gd"
          - "php{{ wordpress_php_version }}-intl"
          - "php{{ wordpress_php_version }}-mbstring"
          - "php{{ wordpress_php_version }}-mysql"
          - "php{{ wordpress_php_version }}-soap"
          - "php{{ wordpress_php_version }}-xml"
          - "php{{ wordpress_php_version }}-xmlrpc"
          - "php{{ wordpress_php_version }}-zip"
          - python3-pymysql  # For the community.mysql.* modules

    # Wordpress CLI

    - name: Install wp-cli
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        dest: /usr/local/bin/wp
        mode: u=rx,g=rx,o=rx
        owner: root
        group: root

    # MariaDB

    - name: Enable MariaDB service
      ansible.builtin.systemd:
        name: mariadb
        enabled: true
        state: started

    - name: Removes all MariaDB anonymous user accounts
      ansible.mariadb.mariadb_user:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        name: ""
        host_all: true
        state: absent

    - name: Create MariaDB Wordpress user
      ansible.mariadb.mariadb_user:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        state: present
        name: "{{ wordpress_db_user }}"
        password: "{{ wordpress_db_password }}"
        priv:
          "wordpress.*": "ALL,GRANT"  # caution: ensure wordpress.* matches the db name

- name: Wordpress as www-data
  become: true
  become_user: www-data
  block:

    - name: Install wordpress
      ansible.builtin.command:
        cmd: "{{ wordpress_wp_cli }} core download --path={{ wordpress_root_dir }}"
      changed_when:
        - _task.result.rc == 0
      failed_when:
        - _task.result.rc != 0
        - '"WordPress files seem to already be present here." not in _task.result.stderr'

    - name: Create wp-config.php
      ansible.builtin.command:
        chdir: "{{ wordpress_root_dir }}"
        cmd: "{{ wordpress_wp_cli }} config create --dbname={{ wordpress_db_name}} --dbuser={{ wordpress_db_user }} --dbpass={{ wordpress_db_password }}"
      changed_when:
        - _task.result.rc == 0
      failed_when:
        - _task.result.rc != 0
        - '"file already exists." not in _task.result.stderr'

    - name: Ensure wp-config is readable by owner only
      ansible.builtin.file:
        path: "{{ wordpress_root_dir }}/wp-config.php"
        mode: u=rw,g=rw,o=

    - name: Create db
      ansible.builtin.command:
        chdir: "{{ wordpress_root_dir }}"
        cmd: "{{ wordpress_wp_cli }} db create"
      changed_when:
        - _task.result.rc == 0
      failed_when:
        - _task.result.rc != 0
        - '"database exists" not in _task.result.stderr'

    - name: Initialize wordpress
      ansible.builtin.command:
        chdir: "{{ wordpress_root_dir }}"
        cmd: "{{ wordpress_wp_cli }} core install --skip-email --url={{ wordpress_url }} --title=\"{{ wordpress_title }}\" --admin_user={{ wordpress_admin_user }} --admin_password={{ wordpress_admin_password }} --admin_email={{ wordpress_admin_email }}"
      changed_when:
         - _task.result.rc == 0
         - '_task.result.stdout.startswith("Success")'

    - name: Install and activate plugins
      ansible.builtin.command:
        chdir: "{{ wordpress_root_dir }}"
        cmd: "{{ wordpress_wp_cli }} plugin install {{ wordpress_plugins | join(' ') }} --activate"
      changed_when:
        - '"Plugin installed successfully" in _task.result.stdout or "activated." in _task.result.stdout'

    - name: Update plugins
      ansible.builtin.command:
        chdir: "{{ wordpress_root_dir }}"
        cmd: "{{ wordpress_wp_cli }} plugin update {{ wordpress_plugins | join(' ') }}"
      changed_when:
        - '"Updated" in _task.result.stdout'

    - name: Enable plugins auto-updates
      ansible.builtin.command:
        chdir: "{{ wordpress_root_dir }}"
        cmd: "{{ wordpress_wp_cli }} plugin auto-updates enable {{ wordpress_plugins | join(' ') }}"
      changed_when:
        - '"Success: Enabled" in _task.result.stdout'
      failed_when:
        - _task.result.rc != 0
        - '"No plugin auto-updates enabled." not in _task.result.stderr'

    - name: Deactivate plugins
      ansible.builtin.command:
        chdir: "{{ wordpress_root_dir }}"
        cmd: "{{ wordpress_wp_cli }} plugin deactivate {{ wordpress_plugins_deactivated | join(' ') }}"
      changed_when:
        - '"Deactivated" in _task.result.stdout'

    # WP_HOME and WP_SITEURL override the URL stored in the database at install
    # time, which WordPress uses for every redirect (e.g. wp-login.php)
    - name: Configure wp-config.php
      ansible.builtin.blockinfile:
        path: "{{ wordpress_root_dir }}/wp-config.php"
        insertbefore: "^/\\* That's all, stop editing"
        block: |
          define( 'WP_HOME', '{{ wordpress_url }}' );
          define( 'WP_SITEURL', '{{ wordpress_url }}' );
          define( 'WP_GOOGLE_LOGIN_CLIENT_ID', '{{ google_auth_client_id }}' );
          define( 'WP_GOOGLE_LOGIN_SECRET', '{{ google_auth_client_secret }}' );
          define( 'WP_GOOGLE_LOGIN_WHITELIST_DOMAINS', 'epicerieledetour.org' );
          define( 'WP_GOOGLE_LOGIN_USER_REGISTRATION', 'true' );
      no_log: true

- name: Instanciate caddy file
  become: true
  become_user: caddy
  ansible.builtin.template:
    src: wordpress.caddy.j2
    dest: /etc/caddy/sites.d/wordpress.caddy
    owner: caddy
    group: caddy
  notify: caddy changed
