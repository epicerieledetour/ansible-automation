---
- name: "Register backup destination {{ borgmatic_destination_hostname }} to hosts file"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[borgmatic_destination_hostname].wireguard_address }}\t{{ borgmatic_destination_hostname }}"

- name: "Adding {{ borgmatic_destination_hostname }} to ssh known hosts"
  ansible.builtin.known_hosts:
    name: "{{ borgmatic_destination_hostname }}"
    key: "{{ borgmatic_destination_hostname }},{{ hostvars[borgmatic_destination_hostname].wireguard_address }} {{ hostvars[borgmatic_destination_hostname].ssh_host_public_ed25519_key }}"

- name: "Configure backup destination {{ borgmatic_destination_hostname }}"
  become: true
  become_user: borg
  delegate_to: "{{ borgmatic_destination_hostname }}"
  block:
    - name: "Create borg backup folder"
      ansible.builtin.file:
        path: "/srv/borg/{{ inventory_hostname }}"
        state: directory

    - name: "Add borg ssh key to borg user"
      ansible.posix.authorized_key:
        user: borg
        key: "{{ borgmatic_ssh_public_key }}"
        state: present
        key_options: "command=\"borg serve --restrict-to-path /srv/borg/{{ inventory_hostname }}\",restrict"

