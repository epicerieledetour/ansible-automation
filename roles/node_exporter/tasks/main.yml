---
- name: Node exporter
  become: true
  block:

    - name: Install prometheus-node-exporter
      ansible.builtin.apt:
        pkg:
          - prometheus-node-exporter

    - name: Start prometheus-node-exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Open port 9100 for prometheus-node-exporter on wireguard network
      community.general.ufw:
        rule: allow
        port: "9100"
        from_ip: 192.168.211.0/24
