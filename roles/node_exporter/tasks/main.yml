---
- name: Node exporter
  become: true
  block:

    - name: Install prometheus-node-exporter
      ansible.builtin.apt:
        pkg:
          - prometheus-node-exporter

    - name: Create Node Exporter textfile collector directory
      ansible.builtin.file:
        path: /var/lib/prometheus/node-exporter
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Enable Node Exporter textfile collector
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: '^ARGS='
        line: 'ARGS="--collector.textfile.directory=/var/lib/prometheus/node-exporter"'
        create: true
        mode: "0644"
      notify: Restart prometheus-node-exporter

    - name: Start prometheus-node-exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Open port 9100 for prometheus-node-exporter on wireguard network
      community.general.ufw:
        rule: allow
        port: "9100"
        from_ip: 192.168.211.0/24
