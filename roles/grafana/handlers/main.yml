---
- name: Reload grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
  listen: "grafana changed"

- name: Reload loki
  ansible.builtin.systemd:
    name: loki
    state: restarted
  listen: "loki changed"

- name: Reload promtail
  ansible.builtin.systemd:
    name: promtail
    state: restarted
  listen: "promtail changed"
