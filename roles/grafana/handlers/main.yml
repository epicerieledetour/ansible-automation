---
- name: Reload grafana
  become: true
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
  listen: grafana changed

- name: Reload loki
  become: true
  ansible.builtin.systemd:
    name: loki
    state: restarted
  listen: loki changed

- name: Reload prometheus
  become: true
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
  listen: prometheus changed
