---
- name: Reload grafana
  become: true
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
  listen: grafana changed

- name: Reload loki
  become: true
  ansible.builtin.systemd:
    name: loki
    state: restarted
  listen: loki changed

- name: Reload alloy
  become: true
  ansible.builtin.systemd:
    name: alloy
    state: restarted
  listen: alloy changed
