---
apiVersion: 1
# Giving an already provisioned datasource a uid makes Grafana see a
# different datasource, and it refuses to start on the conflict: delete the
# old entry first. Only needed once, the first time production starts Grafana
# with this file, but harmless to keep: the entry is recreated right after,
# with the same uid, at every start.
deleteDatasources:
  - name: prometheus
    orgId: 1
datasources:
  - name: prometheus
    # Fixed, referenced by the panels of dashboards/slack.json
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
