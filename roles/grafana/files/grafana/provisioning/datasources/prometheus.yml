---
apiVersion: 1
# Giving an already provisioned datasource a uid makes Grafana see a
# different datasource, and it refuses to start on the conflict: delete the
# old entry first, which costs nothing as it is recreated on every start.
# Remove this block once production has started Grafana with this file, or
# right away after deleting the datasource by hand in production's Grafana.
deleteDatasources:
  - name: prometheus
    orgId: 1
# delete down to here
datasources:
  - name: prometheus
    # Fixed, referenced by the panels of dashboards/slack.json
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
