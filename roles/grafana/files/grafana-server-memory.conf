[Service]
# Grafana (Go) doesn't return freed heap to the OS promptly; GOMEMLIMIT
# forces the GC to target this soft ceiling instead of letting RSS ratchet
# up indefinitely across dashboard refreshes. MemoryMax is a hard backstop
# so a runaway Grafana can't OOM the rest of the webserver stack.
Environment=GOMEMLIMIT=896MiB
MemoryMax=1024M
