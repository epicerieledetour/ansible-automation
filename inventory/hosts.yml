workstations:
  vars:
    ansible_connection: local
  children:
    workstations_networkd:
      hosts:
        charles-ws:
    workstations_nm:
      hosts:
        charles-lp:

servers:
  hosts:
    pi1:
      ansible_host: 192.168.211.30
      ansible_user: debian
    srv1:
      ansible_host: 192.168.211.60
      ansible_user: debian
    vps2:
      # The address wireguard clients dial. ansible_host derives from it rather
      # than the other way around, so the first-run bootstrap override
      # (-e "ansible_host=<LAN IP>", see README "First setup of a production
      # machine") cannot leak into the peers' wireguard config: -e applies to
      # every host, not just the one under --limit.
      wireguard_endpoint_host: vps-53fcb87d.vps.ovh.ca
      ansible_host: "{{ wireguard_endpoint_host }}"
      ansible_user: debian
