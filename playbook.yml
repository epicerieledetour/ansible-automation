---
# Workstations are never configured by default, run for example
# ansible-playbook playbook.yml --limit charles-ws --tags workstations_networkd
- name: "Setup workstation wireguard with systemd-networkd"
  hosts: workstations_networkd
  roles:
    - role: workstations_networkd
      tags: ["workstations_networkd"]
  tags:
    - never
    - workstation

- name: "Setup workstation wireguard with NetworkManager"
  hosts: workstations_nm
  roles:
    - role: workstations_nm
      tags: ["workstations_nm"]
  tags:
    - never
    - workstation

- name: "Initial ssh configuration"
  hosts: servers
  roles:
    # Before authorized_keys: it installs a different key set per deployment.
    - role: common_facts
      tags: ["always", "common_facts"]
    - role: authorized_keys
      tags: ["authorized_keys"]
    - role: sshd
      tags: ["sshd"]
  tags:
    - ssh

- name: "Setup common facts for all machines in the inventory"
  hosts: servers
  vars:
    group_suffix: "-server"
  roles:
    - role: common_facts
      tags: ["always", "common_facts"]
    - role: common_packages
      tags: ["common_packages"]
    - role: hostname
      tags: ["hostname"]
    - role: timezone
      tags: ["timezone"]
    - role: upgrade
      tags: ["upgrade"]
    - role: ufw
      tags: ["ufw"]
    # After ufw: its rsyslog gives the sshd jail an /var/log/auth.log to read.
    - role: fail2ban
      tags: ["fail2ban"]
    - role: wireguard
      tags: ["wireguard"]
    - role: srv
      tags: ["srv"]
  tags:
    - common

- name: Setup borg repository stores
  hosts: backup_destinations
  roles:
    - role: borg_storage
      tags: ["borg_storage"]
    - borg_destination
  tags:
    - backup
    - destination

- name: Setup borg on servers that needs to be backed up
  hosts: backup_sources
  roles:
    - systemd_handlers
    - borgmatic
    - role: borgmatic_system
      tags: ["borgmatic_system"]
  tags:
    - backup
    - source

- name: Setup grafana, loki and prometheus, served through the webservers' caddy
  hosts: grafana
  roles:
    - role: systemd_handlers
    - role: grafana
      tags: ["grafana"]
  tags: ["grafana"]

- name: Setup web servers
  hosts: webservers
  roles:
    - role: systemd_handlers
    - role: caddy_handlers
    - role: caddy
      tags: ["caddy"]
    - role: vouchers
      tags: ["vouchers"]
    - role: membres
      tags: ["membres"]
    - role: wordpress
      tags: ['wordpress']
    - role: grafana_proxy
      tags: ["grafana", "grafana_proxy"]
  tags: ['webservers']

- name: Setup monitoring agents
  hosts: servers
  roles:
    - role: node_exporter
      tags: ["node_exporter"]
    - role: alloy
      tags: ["alloy"]

