---
- name: "Generate workstation wireguard config"
  hosts: workstations
  connection: local
  vars:
    group_suffix: "-workstation"
  roles:
    - role: wireguard
      tags:
        - wireguard
        - workstation
  tags:
    - never

- name: "Setup common facts for all machines in the inventory"
  hosts: servers
  roles:
    - role: common-facts
      tags: ["common-facts"]
    - role: authorized-keys
      tags: ["authorized-keys"]
    - role: common-packages
      tags: ["common-packages"]
    - role: hostname
      tags: ["hostname"]
    - role: timezone
      tags: ["timezone"]
    - role: upgrade
      tags: ["upgrade"]
    - role: ufw
      tags: ["ufw"]
  tags:
    - common

